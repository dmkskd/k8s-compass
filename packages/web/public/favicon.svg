<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="20" fill="url(#bg)"/>
  <g transform="translate(50,50)">
    <!-- Kubernetes wheel simplified -->
    <circle cx="0" cy="0" r="8" fill="url(#accent)"/>
    <g stroke="url(#accent)" stroke-width="3" fill="none">
      <circle cx="0" cy="0" r="22"/>
    </g>
    <!-- Spokes -->
    <g stroke="url(#accent)" stroke-width="2.5">
      <line x1="0" y1="-8" x2="0" y2="-30"/>
      <line x1="7" y1="4" x2="26" y2="15"/>
      <line x1="-7" y1="4" x2="-26" y2="15"/>
    </g>
    <!-- Node circles -->
    <circle cx="0" cy="-32" r="6" fill="url(#accent)"/>
    <circle cx="28" cy="16" r="6" fill="url(#accent)"/>
    <circle cx="-28" cy="16" r="6" fill="url(#accent)"/>
  </g>
</svg>
