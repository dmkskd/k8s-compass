[project]
name = "k8s-api-pipeline"
version = "0.1.0"
description = "Data pipeline for K8s API Explorer - fetches OpenAPI specs, parses schemas"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "rich>=13.0",
    "typer>=0.12.0",
    "pyarrow>=15.0",
    "tree-sitter>=0.25.2",
    "tree-sitter-go>=0.25.0",
    "strands-agents[ollama]>=0.1.0",
    "githubkit>=0.14.2",
    "python-dotenv>=1.2.1",
    "google-genai>=1.59.0",
    "textual>=0.89.0",
    "beautifulsoup4>=4.12.0",
]

[project.optional-dependencies]
duckdb = [
    "duckdb>=1.0",
]
lance = [
    "pylance>=0.20",
]
vortex = [
    "vortex-data>=0.30",
]
embeddings = [
    "sentence-transformers>=3.0",
]
benchmark = [
    "duckdb>=1.0",
    "zstandard>=0.22",
]
all-formats = [
    "duckdb>=1.0",
    "pylance>=0.20",
    "vortex-data>=0.30",
    "zstandard>=0.22",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.4.0",
]

[project.scripts]
k8s-pipeline = "k8s.cli:main"
k8s-tui = "k8s.tui:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/k8s"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "UP",     # pyupgrade
    "RUF",    # ruff-specific
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # function call in default argument (typer pattern)
    "B904",   # raise without from in except (typer.Exit pattern)
    "RUF022", # unsorted __all__ (we group by module for readability)
]

[tool.ruff.lint.isort]
known-first-party = ["k8s"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
